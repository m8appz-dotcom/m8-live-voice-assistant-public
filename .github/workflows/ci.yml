name: M8 Live web checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, edited]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Validate SDK and native configuration
        run: npm run check:sdk
      - name: Dependency audit
        run: npm audit --audit-level=low
      - name: Audio and bridge regressions
        run: npm test
      - name: Export actual Expo web client
        run: npm run build:web
      - name: Export original hosted workspace with strict CSP assets
        run: node scripts/export-hosted-workspace.mjs
